# Main settings. Edit freely. Money limits live in [budget].
# Nothing paid runs unless you pass --approve-spend on the command line.

[pipeline]
daily_qualified_target = 20
# Skip a handle we already looked at within this many days (saves paying twice).
recheck_after_days = 90

[budget]
# Hard caps in USD. The pipeline refuses to start a paid step that could exceed them.
apify_per_run_usd   = 2.00
apify_daily_usd     = 1.50
apify_monthly_usd   = 35.00
claude_per_run_usd  = 3.00
claude_daily_usd    = 3.00
claude_monthly_usd  = 75.00
# Hunter is counted in credits, not dollars. Free plan = 50 credits/month.
hunter_monthly_credits = 45

[apify]
# Keyword discovery. Official Apify Actor. Returns full profile data per user.
discovery_actor = "apify/instagram-search-scraper"
discovery_price_per_result = 0.0027      # FREE-tier price, Oct 2026
# Username enrichment / lookalike "snowball" from relatedProfiles.
profile_actor = "apify/instagram-profile-scraper"
profile_price_per_result = 0.0026
# Optional paid email fallback. Off unless you pass --apify-contacts.
contact_actor = "memo23/instagram-email-phone-scraper"
contact_price_per_profile = 0.002
contact_price_per_contact = 0.005
contact_batch_size = 3   # free Apify plan: this Actor stops after 3 profiles per run
# How long to wait for one Actor run before giving up (seconds).
run_timeout_seconds = 900

[claude]
# "api" = call the Claude API (needs ANTHROPIC_API_KEY, billed per token).
# "manual" = write a batch file you paste into claude.ai chat, then import the answer. $0 extra.
mode = "manual"
model = "claude-opus-5-5"
# Cheaper option: "claude-haiku-5-5" (about 95% cheaper). Compare both in the 100-profile test.
effort = "low"
max_profiles_per_run = 60
# Price per million tokens, used only for budget estimates.
input_usd_per_mtok  = 4.00
output_usd_per_mtok = 20.00
est_input_tokens_per_profile  = 1800
est_output_tokens_per_profile = 900

[contacts]
fetch_websites = true          # free: visit the bio link / link-in-bio page and look for emails
max_pages_per_lead = 4
request_timeout_seconds = 12
use_hunter = false             # set true (or pass --hunter) once HUNTER_API_KEY is set
check_mail_provider = true     # free DNS lookup: drops dead domains, tags google/microsoft/etc.
# Test 2026-10-30: the Apify contact Actor is the best email source. It returns the email
# behind Instagram's contact button, which the search Actor doesn't. ~$0.005 per qualified lead.

[sourcing]
# Daily footage-first sourcing: `python run.py source`. Run from Sam's PC (YouTube
# bot-checks cloud IPs). Reads metadata only, never downloads videos, never contacts anyone.
queries = [
  "how to get coaching clients 2026", "sales coach discovery call tips", "marketing for coaches content strategy",
  "how to price your coaching offer", "LinkedIn for coaches get clients", "business coach lead magnet funnel",
  "high ticket sales coach", "how to sign high ticket clients", "client acquisition for coaches",
  "coaching business growth strategy", "how to scale a coaching business", "sales calls for coaches objection handling",
  "content strategy for business coaches", "organic lead generation for coaches", "group coaching program launch",
  "how to fill your coaching program", "consultant how to get clients", "B2B sales coach",
  "email marketing for coaches", "instagram for coaches get clients", "webinar funnel for coaches",
  "personal brand for business owners", "how to build an online course business", "leadership coach for founders",
]
per_query = 15                # search results per query (duplicates of the same channel collapse)
max_channels_per_run = 200    # footage checks per run, after skipping known channels
long_form_n = 2               # newest long-form videos measured per channel
shorts_n = 1                  # newest Short measured per channel
min_usable_width = 900        # px across a 9:16 crop: min(width, height*9/16)
# Footage tags (Lane in Notion): long-form >= 900 px usable = Spec edit; only a 1080x1920 Short
# passes = Spec, check frame; 1080p landscape long-form (608 px) = Spec, card layout;
# 720p or lower / reel-only = Mockup. A bot check is UNMEASURED and retried next run.
sleep_seconds = 2.0           # pause between YouTube calls
bot_retries = 3               # retries with backoff after "confirm you're not a bot"; then UNMEASURED
cookies_from_browser = ""     # optional, e.g. "chrome", if YouTube keeps bot-checking the PC
icp_model = "claude-haiku-5-5"  # the 7-check ICP screen is a yes/no checklist, the cheap model is enough
instagram_contacts = true     # Apify contact Actor for survivors with an Instagram handle (paid, capped)
recheck_days = 60             # re-measure a scanned channel after this many days (UNMEASURED: next run)
expand_from_winners = 15      # footage PASS channels whose neighbours we also scan
related_per_winner = 6        # suggested channels + similar-title search results per winner

# Notion (the only lead store). Column names copied from Prospects; the job reads the live
# schema and skips any column that doesn't exist.
notion_prospects_ds = "fd2eff14-d997-41e2-96b6-e60da54f0613"
notion_summary_parent = "403bfc8a6cbf8173b595de3bb6671dc9"   # Outreach HQ page
col_name = "Name"
col_instagram = "IG"
col_email = "Email"
col_lane = "Lane"
col_status = "Status"
col_asset = "Asset"
col_next = "Next touch"
col_notes = "Notes"
lane_spec = "Spec edit"
lane_spec_frame = "Spec, check frame"
lane_spec_card = "Spec, card layout"
lane_mockup = "Mockup"
status_new = "Queued"
