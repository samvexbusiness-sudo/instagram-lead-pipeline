# Cheap yes/no checks run in Python BEFORE Claude sees a profile.
# Set from the 60-second triage in Sam's sam-freelance-business skill. Kept loose:
# Claude (with ICP_CRITERIA.md) makes the real call, Sam still watches before sending anything.

min_followers = 500           # just drops dead/new accounts. Size is NOT a money signal (Sam 2026-10-30): an offer/funnel is
max_followers = 150000        # bigger accounts reply less, but don't throw them out (Sam 2026-10-30)
require_offer_signal = true   # must show an offer/funnel: link in bio, DM/comment keyword, apply/book CTA
exclude_verified = false      # blue check is fine (Sam, 2026-10-30)
min_posts = 15
max_days_since_last_post = 30
require_public = true
require_english = true        # outreach and mockups are in English
min_english_score = 0.12
# Talking-head proxies (we can't watch the videos, so these are signals, not proof):
min_video_share = 0.3          # at least ~1 in 3 recent posts is a video/reel
min_original_audio_share = 0.4 # of their reels, share where someone talks (vs a licensed song)
require_business_or_creator_account = false
require_external_link = false # "Email is the last check, not a gate"

# Triage check 3 + niche: sells coaching/info to founders and professionals.
include_any = [
  "coach", "coaching", "mentor", "consultant", "consulting", "founder",
  "entrepreneur", "clients", "scale", "high ticket", "high-ticket", "business",
]

# Not software, not content services (competitors), and off-niche coaches.
exclude_any = [
  "fitness coach", "personal trainer", "nutrition", "weight loss", "crypto", "forex", "trading",
  "bus ", "coach hire", "travel", "onlyfans", "meme", "fan page", "fanpage",
  "video editor", "editing services", "content agency", "social media manager", "smm agency",
  "ugc creator", "saas", "software",
  # Sam 2026-10-30: tactical business value, not mindset/feelings; solo, not agencies
  "mindset coach", "manifest", "spiritual", "soul", "healing", "nervous system", "emotional",
  "therapist", "psychologist", "life coach", "wellbeing", "wellness",
  "marketing agency", "digital marketing agency", "social media management", "social media marketing agency",
  "agency ®", "we are a team", "real estate", "realtor", "mortgage",
]

exclude_categories = ["Video Creator", "Gamer", "Musician/Band", "Artist", "Software Company"]

# Lookalike ("suggested accounts") pre-screen. Runs on the name + handle Instagram gives us
# for free, before we pay to scrape the profile.
lookalike_name_include = "coach|sales|marketing|business|biz|funnel|strateg|mentor|content|system|ceo|growth|leader|consult|brand|client|scale|launch|offer|entrepreneur|founder|closer|ads"
lookalike_name_exclude = "health|heal|fitness|fertility|nutrition|wellness|property|real ?estate|realtor|mortgage|legal|dentist|music|divorce|counsel|esthetic|jewel|photo|lending|broker|invest|wealth|cpa|mindful|soul|spiritual|craft|travel|dance|energy|agency|studio|ugc|smm|social media manag"
